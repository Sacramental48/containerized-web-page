name: Docker Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t project-one:test .

      - name: Run Docker container
        run: docker run -d --name project-one-test -p 8080:80 project-one:test

      - name: Test website response
        run: |
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Website is responding successfully"
              exit 0
            fi
            echo "Waiting for website..."
            sleep 2
          done

          echo "Website did not respond"
          docker logs project-one-test
          exit 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push  Docker image
        env:
          IMAGE_NAME: ${{ github.repository }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag project-one:test ghcr.io/$IMAGE_NAME:latest
          docker push ghcr.io/$IMAGE_NAME:latest

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'bash ~/deploy-project-one.sh'

      - name: Cleanup test container
        if: always()
        run: docker rm -f project-one-test || true
